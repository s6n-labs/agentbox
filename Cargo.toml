[package]
name = "agentbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
buffa = { version = "0.9.2", features = ["json"] }
clap = { version = "4.6.7", features = ["derive"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "server", "client"] }
dirs = "7.0.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "service", "tokio"] }
json-patch = "5.0.0"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["user", "signal", "process", "socket", "uio", "fs"] }
ratatui = "0.30.2"
rmcp = { version = "3.9.0", features = ["server", "macros", "schemars", "transport-async-rw"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
which = "8.0.6"

[build-dependencies]
connectrpc-build = "0.9.0"
protoc-bin-vendored = "3.3.0"
